name: Bug
description: Something in the machine is broken
title: '[bug] '
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: combo
    attributes:
      label: Combo URL
      description: If it matters, paste the share link (e.g. /?p=web&t=POS&n=barbers).
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Safari 18, Firefox 128, …
